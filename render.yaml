# render.yaml
# Configurazione servizi Render.com per shopify-mysql-sync

services:
  # Web service triggerabile da Scheduler
  - type: web
    name: shopify-mysql-sync
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:10000 --timeout 120 --workers 1"
    envVars:
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-04"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DEBUG
        value: "true"
      - key: PORT
        value: "10000"

  # Cron job manuale per reset varianti (eseguire solo quando necessario)
  - type: cron
    name: reset-variants
    runtime: python
    region: frankfurt
    plan: free
    schedule: "0 0 31 2 *"  # Mai (31 febbraio non esiste) - esecuzione solo manuale
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python reset_variants.py"
    envVars:
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-04"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: PRODUCT_IDS
        sync: false  # Impostare manualmente prima dell'esecuzione
      - key: DEBUG
        value: "true"
